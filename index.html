<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marvel D&D 5e – Karty bohaterów</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">M</div><div><h1>Marvel D&D 5e</h1><small>JSON per bohater • poziom 5</small></div></div>
    <input id="search" class="search" placeholder="Szukaj postaci, drużyny, klasy...">
    <div class="filters" id="filters"></div>
    <div id="categoryHint" class="category-hint"></div>
    <div class="char-list" id="charList"></div>
  </aside>
  <main class="main">
    <section class="hero" id="hero"><div class="loading">Start aplikacji…</div></section>
    <div class="toolbar"><button id="shortRestBtn">Krótki odpoczynek</button><button id="longRestBtn">Długi odpoczynek</button><button id="resetBtn" class="quiet">Reset postaci</button><button onclick="window.print()">Drukuj kartę</button></div>
    <nav class="game-tabs" id="gameTabs" aria-label="Widok karty">
      <button class="game-tab active" data-view="combat">Walka</button>
      <button class="game-tab" data-view="abilities">Zdolności</button>
      <button class="game-tab" data-view="sheet">Karta</button>
    </nav>
    <section class="grid" id="content"></section>
    <div class="footer">Każdy bohater jest osobnym plikiem JSON. JavaScript zawiera wyłącznie logikę aplikacji.</div>
  </main>
</div>
<button class="dice-launcher" id="diceLauncher" aria-label="Otwórz generator kości">🎲 <span>Kości</span></button>
<dialog class="dice-dialog" id="diceDialog">
  <form method="dialog" class="dice-shell">
    <button class="dialog-close" value="close" aria-label="Zamknij">×</button>
    <div class="dice-kicker">Generator rzutów</div>
    <h2 id="diceTitle">Wybierz sposób rzutu</h2>
    <p class="dice-instruction" id="diceInstruction"></p>
    <div class="dice-stage" id="diceStage">
      <div class="dice-canvas" id="diceBox" hidden></div>
      <div class="dice-fallback" id="diceFallback"></div>
    </div>
    <div class="dice-result" id="diceResult" aria-live="polite"></div>
    <div class="dice-mode-actions" id="diceModeActions">
      <button type="button" class="manual-roll" id="manualRollBtn">Rzucam ręcznie</button>
      <button type="button" class="virtual-roll primary" id="virtualRollBtn">Rzut wirtualny</button>
    </div>
    <details class="custom-dice">
      <summary>Własny rzut</summary>
      <div class="custom-dice-row">
        <label>Liczba <input id="diceCount" type="number" min="1" max="12" value="1"></label>
        <label>Kość <select id="diceSides"><option>4</option><option selected>6</option><option>8</option><option>10</option><option>12</option><option>20</option><option>100</option></select></label>
        <label>Modyfikator <input id="diceModifier" type="number" min="-50" max="50" value="0"></label>
        <button type="button" id="customDiceBtn">Przygotuj</button>
      </div>
    </details>
  </form>
</dialog>
<script type="module" src="js/app.js?v=3d-1"></script>
</body>
</html>
