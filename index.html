<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marvel D&D 5e – Karty postaci</title>
<style>
:root {
  --bg:#0c0f14; --panel:#171b23; --panel2:#11151c; --line:#2a3240;
  --text:#eef2f7; --muted:#9da8b8; --blue:#55a7ff; --red:#ef4b59;
  --gold:#f0c35c; --green:#7bd889; --shadow:0 12px 32px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#090b0f,#111722 72%,#0c0f14);color:var(--text);
font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:320px minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);padding:22px;background:rgba(12,15,20,.96);backdrop-filter:blur(12px)}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:950;background:linear-gradient(135deg,var(--red),#ff8b71);box-shadow:var(--shadow)}
.brand h1{font-size:18px;margin:0}
.brand small{display:block;color:var(--muted);margin-top:3px}
.search{width:100%;padding:11px 12px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;outline:none}
.search:focus{border-color:var(--blue)}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0 16px}
.filter{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:6px 10px;cursor:pointer;font-size:12px}
.filter.active{color:white;border-color:var(--blue);background:#1a2635}
.category-hint{
  min-height:34px;
  margin:-7px 0 14px;
  color:var(--muted);
  font-size:11px;
  line-height:1.4;
}
.char-list{display:flex;flex-direction:column;gap:8px}
.char-btn{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:13px;padding:12px 13px;cursor:pointer;transition:.15s}
.char-btn:hover{transform:translateY(-1px);border-color:#46536b}
.char-btn.active{border-color:var(--blue);background:linear-gradient(180deg,#202a39,#19212d)}
.char-name{font-weight:800;display:block}
.char-meta{display:block;color:var(--muted);font-size:11px;margin-top:3px;line-height:1.35}
.main{padding:28px 34px 56px;min-width:0}
.hero{background:radial-gradient(circle at top right,rgba(85,167,255,.14),transparent 34%),var(--panel);border:1px solid var(--line);border-radius:24px;padding:27px;box-shadow:var(--shadow)}
.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:850;color:var(--blue)}
.hero h2{font-size:36px;line-height:1.05;margin:7px 0 4px}
.real{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px}
.chip{background:#111720;border:1px solid var(--line);border-radius:999px;padding:6px 9px;color:#d9e0ea;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(6,minmax(85px,1fr));gap:9px;margin-top:21px}
.stat{border:1px solid var(--line);background:var(--panel2);border-radius:13px;padding:11px;text-align:center}
.stat .lab{color:var(--muted);font-size:10px;letter-spacing:.09em}
.stat .score{font-weight:900;font-size:24px}
.stat .mod{color:var(--blue);font-size:12px}
.quick{display:grid;grid-template-columns:repeat(6,minmax(90px,1fr));gap:9px;margin-top:10px}
.q{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 11px}
.q span{display:block;color:var(--muted);font-size:10px}
.q strong{font-size:17px}
.toolbar{display:flex;justify-content:flex-end;gap:8px;margin:12px 0 18px}
.toolbar button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:8px 11px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.card.full{grid-column:1/-1}
.card-head{display:flex;justify-content:space-between;align-items:center;padding:15px 17px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.025),transparent)}
.card-head h3{margin:0;font-size:15px}
.card-body{padding:15px 17px}
.rows{display:grid;gap:0}
.row{display:grid;grid-template-columns:minmax(130px,40%) 1fr;gap:12px;padding:8px 0;border-bottom:1px dashed #303747}
.row:last-child{border-bottom:0}
.k{color:var(--muted)} .v{font-weight:700}
.feature{border:1px solid var(--line);background:var(--panel2);border-radius:13px;padding:12px 13px;margin-bottom:9px}
.feature:last-child{margin-bottom:0}
.feature h4{margin:0 0 5px;font-size:13px}
.feature p{margin:0;color:#d4dae5;font-size:13px;line-height:1.5}
.tag{display:inline-block;margin-left:6px;border-radius:999px;padding:2px 6px;font-size:9px;letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:#18130a;vertical-align:2px}
.tag.prof{background:var(--green);color:#07150a}
.tag.exp{background:var(--gold)}
.skill-help{margin-bottom:12px;padding:10px 12px;border:1px solid rgba(85,167,255,.28);background:rgba(85,167,255,.07);border-radius:12px;color:#cfd9e8;font-size:12px;line-height:1.45}
.skill-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px}
.skill-header,.skill-row{display:grid;grid-template-columns:minmax(210px,1.7fr) 90px 58px 94px;gap:8px;align-items:center}
.skill-header{padding:7px 0 9px;border-bottom:1px solid var(--line);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.skill-row{padding:8px 0;border-bottom:1px dashed #303747}
.skill-row .ability{color:var(--muted);font-size:11px}
.skill-row .bonus{font-weight:850}
.skill-row .status{font-size:10px;color:var(--muted)}
.skill-label{display:inline-flex;align-items:center;gap:6px;position:relative;outline:none;cursor:help;line-height:1.3}
.skill-label .info{width:16px;height:16px;border:1px solid #48556b;border-radius:50%;display:inline-grid;place-items:center;color:var(--blue);font-size:10px;flex:0 0 auto}
.skill-label::after{content:attr(data-tip);position:absolute;z-index:30;left:0;bottom:calc(100% + 10px);width:min(360px,80vw);padding:10px 12px;border:1px solid #46536a;border-radius:10px;background:#0b1017;color:#eef2f7;box-shadow:0 12px 30px rgba(0,0,0,.42);font-size:12px;font-weight:500;line-height:1.45;opacity:0;visibility:hidden;transform:translateY(4px);transition:.12s;pointer-events:none;white-space:normal}
.skill-label::before{content:"";position:absolute;z-index:31;left:18px;bottom:calc(100% + 4px);border:6px solid transparent;border-top-color:#46536a;opacity:0;visibility:hidden;transition:.12s}
.skill-label:hover::after,.skill-label:focus::after,.skill-label:hover::before,.skill-label:focus::before{opacity:1;visibility:visible;transform:translateY(0)}
.origin-note{font-size:11px;color:var(--muted);margin-top:8px}

.attack{display:grid;grid-template-columns:1.35fr .55fr 1.1fr 1fr;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.attack:last-child{border-bottom:0}
.attack small{color:var(--muted)}
.spell{display:grid;grid-template-columns:145px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.spell:last-child{border-bottom:0}
.spell div:last-child{font-size:13px;color:#d4dae5;line-height:1.45}
.note{border:1px solid rgba(85,167,255,.28);background:rgba(85,167,255,.08);border-radius:12px;padding:11px 12px;color:#dfebfa;font-size:12px;line-height:1.45}
.subtle{color:var(--muted);font-size:11px}
.footer{text-align:center;color:var(--muted);font-size:11px;margin-top:28px}
@media(max-width:1050px){
 .app{grid-template-columns:1fr} .sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}
 .char-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
 .stats{grid-template-columns:repeat(3,1fr)} .quick{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:720px){
 .main{padding:17px} .grid{grid-template-columns:1fr} .card.full{grid-column:auto}
 .char-list{grid-template-columns:1fr} .stats{grid-template-columns:repeat(2,1fr)} .quick{grid-template-columns:repeat(2,1fr)}
 .skill-grid{grid-template-columns:1fr} .skill-header{display:none} .skill-header,.skill-row{grid-template-columns:minmax(170px,1.7fr) 78px 52px 88px} .row,.spell{grid-template-columns:1fr} .attack{grid-template-columns:1fr 1fr}
 .hero h2{font-size:29px}
}
@media print{
 body{background:white;color:black} .sidebar,.toolbar{display:none!important} .app{display:block} .main{padding:0}
 .hero,.card{box-shadow:none;background:white;border-color:#bbb;break-inside:avoid} .feature,.stat,.q{background:white}
 .k,.real,.subtle,.skill-row .ability,.skill-row .status,.attack small,.footer{color:#555!important}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="logo">M</div><div><h1>Marvel D&D 5e</h1><small>37 kart, poziom 5</small></div></div>
  <input id="search" class="search" placeholder="Szukaj postaci, klasy lub rasy...">

</main>
</div>

}, {"id": "quicksilver", "name": "Quicksilver", "realName": "Pietro Maximoff", "race": "Mutant superszybkości", "cls": "Monk", "subclass": "Way of the Open Hand", "background": "Far Traveler", "alignment": "Chaotic Good", "stats": {"STR": 8, "DEX": 18, "CON": 13, "INT": 10, "WIS": 14, "CHA": 10}, "ac": 16, "speed": 45, "saveProfs": ["STR", "DEX"], "skillProfs": ["Acrobatics", "Athletics", "Perception", "Stealth"], "expertise": [], "feats": ["Mobile"], "marvel": [["Super Speed", "Hare-Trigger, Rabbit Hop i monkowa mobilność opisują nadludzką prędkość."], ["Speed Barrage", "Raz na Short Rest po użyciu Flurry of Blows może wykonać dodatkowy jeden unarmed strike jako część tej samej Bonus Action."]], "attacks": [["Unarmed Strike", "+7", "1d6+4 bludgeoning", "melee"], ["Flurry of Blows", "+7", "2 × 1d6+4", "Bonus Action, 1 Ki"], ["Speed Barrage", "+7", "+1 dodatkowy 1d6+4", "1/Short Rest po Flurry"]], "spells": [], "group": "Mutanci", "fighting": "", "maneuvers": [], "extras": [["Ki", "5 Ki Points, Ki Save DC 13."], ["Rabbit Hop", "Bonus Action skok bez Opportunity Attacks."], ["Initiative", "Dodaje DEX modifier i proficiency bonus z Hare-Trigger."]], "tools": "", "languages": "English", "source": "D&D 5e 2014 + dodatki", "raceRules": "Harengon", "team": "Avengers / X-Factor", "gender": "Mężczyzna", "isMutant": true, "skillAliases": {"Acrobatics": "Superszybkość", "Athletics": "Sprint", "Perception": "Błyskawiczna obserwacja", "Stealth": "Rozmycie ruchu"}, "raceFeatureOverrides": {"Hare-Trigger": ["Błyskawiczny start", "Mechanicznie bez zmian: dodajesz proficiency bonus do Initiative. To nadludzki refleks Pietro."], "Leporine Senses": ["Przyspieszona percepcja", "Mechanicznie bez zmian: proficiency w Perception."], "Lucky Footwork": ["Korekta pędu", "Mechanicznie bez zmian: po nieudanym DEX Save możesz użyć Reaction i dodać d4. To szybkie przesunięcie się w ostatniej chwili."], "Rabbit Hop": ["Zryw szybkości", "Mechanicznie bez zmian: Bonus Action skok bez Opportunity Attacks. Opisuj to jako natychmiastowy sprint albo błyskawiczny unik."]}}], "skillAbility": {"Acrobatics": "DEX", "Animal Handling": "WIS", "Arcana": "INT", "Athletics": "STR", "Deception": "CHA", "History": "INT", "Insight": "WIS", "Intimidation": "CHA", "Investigation": "INT", "Medicine": "WIS", "Nature": "INT", "Perception": "WIS", "Performance": "CHA", "Persuasion": "CHA", "Religion": "INT", "Sleight of Hand": "DEX", "Stealth": "DEX", "Survival": "WIS"}, "featDesc": {"Shield Master": "Po wykonaniu Attack Action możesz użyć Bonus Action do Shove tarczą. Dodajesz bonus tarczy do niektórych DEX Saves przeciwko efektom celującym tylko w ciebie. Przy udanym DEX Save przeciwko efektowi z połową obrażeń możesz użyć Reaction, aby otrzymać 0 obrażeń.", "Inspiring Leader": "Po 10 minutach przemowy maksymalnie 6 sojuszników otrzymuje Temporary HP równe poziomowi + modyfikator CHA. Na 5. poziomie Capa to 6 Temporary HP.", "War Caster": "Advantage na CON Saves do utrzymania Concentration. Możesz wykonywać komponenty somatyczne z zajętymi rękami. Opportunity Attack możesz zastąpić zaklęciem o czasie rzucania 1 Action, które celuje tylko w prowokującą istotę.", "Crusher": "+1 STR lub CON. Raz na turę po zadaniu bludgeoning damage możesz przesunąć cel o 5 ft. Po critical hit z bludgeoning damage ataki przeciwko celowi mają Advantage do początku twojej następnej tury.", "Alert": "+5 do Initiative. Nie możesz zostać zaskoczony, gdy jesteś przytomny. Niewidoczni napastnicy nie dostają Advantage tylko dlatego, że ich nie widzisz.", "Mobile": "+10 ft Speed. Po Dash ignorujesz difficult terrain w tej turze. Po wykonaniu melee attack przeciwko stworzeniu nie prowokujesz od niego Opportunity Attack w tej turze, niezależnie od trafienia.", "Sharpshooter": "Ataki dystansowe ignorują half i three-quarters cover, nie mają Disadvantage na long range. Przed rzutem możesz wybrać -5 do attack roll, aby przy trafieniu dodać +10 damage.", "Piercer": "+1 DEX lub STR. Raz na turę możesz przerzucić jedną kość piercing damage. Przy critical hit dodajesz jedną dodatkową kość obrażeń broni.", "Telekinetic": "+1 INT, WIS lub CHA. Ulepszony Mage Hand, który może być niewidzialny. Jako Bonus Action możesz spróbować przesunąć stworzenie o 5 ft po nieudanym STR Save.", "Slasher": "+1 STR lub DEX. Raz na turę po zadaniu slashing damage zmniejszasz Speed celu o 10 ft. Po critical hit cel ma Disadvantage na attack rolls do początku twojej następnej tury.", "Dual Wielder": "+1 AC podczas walki dwiema broniami. Możesz używać two-weapon fighting z broniami niebędącymi light. Możesz dobyć lub schować dwie bronie naraz.", "Observant": "+1 INT lub WIS. +5 Passive Perception i Passive Investigation. Potrafisz czytać z ruchu ust, jeśli widzisz mówiącą osobę i znasz język.", "Tough": "Maximum HP zwiększa się o 2 za każdy poziom. Na 5. poziomie daje +10 HP.", "Spell Sniper": "Podwaja zasięg zaklęć wymagających attack roll, ignoruje half i three-quarters cover oraz daje jeden cantrip z attack rollem z wybranej listy.", "Gunner": "+1 DEX. Proficiency z firearms, ignorowanie właściwości loading, brak Disadvantage za ranged attack w 5 ft od przeciwnika.", "Heavy Armor Master": "+1 STR. Podczas noszenia heavy armor zmniejszasz niemagiczne bludgeoning, piercing i slashing damage o 3.", "Grappler": "Masz Advantage na attack rolls przeciwko stworzeniu, które grapple'ujesz. Możesz próbować unieruchomić siebie i grapple'owany cel zgodnie z zasadami featu.", "Mounted Combatant": "Advantage na melee attacks przeciwko mniejszym niejeżdżącym celom, możesz przejmować ataki wymierzone w wierzchowca, a wierzchowiec lepiej unika efektów wymagających DEX Save.", "Actor": "+1 CHA. Advantage na Deception i Performance podczas udawania innej osoby. Możesz naśladować głos lub dźwięki po krótkim słuchaniu.", "Tavern Brawler": "+1 STR lub CON. Proficiency z improvised weapons. Unarmed strike używa d4. Po trafieniu unarmed strike lub improvised weapon możesz jako Bonus Action spróbować Grapple.", "Lucky": "Masz 3 Luck Points na Long Rest. Możesz wydać punkt, aby rzucić dodatkowym d20 przy swoim attack roll, ability check lub saving throw i wybrać, którego wyniku użyjesz. Możesz też wydać punkt, gdy przeciwnik wykonuje attack roll przeciwko tobie, i wybrać między jego rzutem a dodatkowym d20.", "Elemental Adept (Lightning)": "Zaklęcia zadające lightning damage ignorują resistance na lightning. Gdy rzucasz kość obrażeń lightning za zaklęcie, wynik 1 traktujesz jako 2.", "Elemental Adept (Cold)": "Zaklęcia zadające cold damage ignorują resistance na cold. Gdy rzucasz kość obrażeń cold za zaklęcie, wynik 1 traktujesz jako 2.", "Elemental Adept (Fire)": "Zaklęcia zadające fire damage ignorują resistance na fire. Gdy rzucasz kość obrażeń fire za zaklęcie, wynik 1 traktujesz jako 2.", "Fey Touched": "+1 do INT, WIS albo CHA. Znasz Misty Step i jedno zaklęcie 1. poziomu ze szkoły Divination lub Enchantment. Każde możesz rzucić raz na Long Rest bez spell slota, a później także normalnie swoimi slotami.", "Telepathic": "+1 do INT, WIS albo CHA. Możesz telepatycznie mówić do istoty w zasięgu 60 ft, jeśli zna co najmniej jeden język. Znasz Detect Thoughts i możesz rzucić je raz na Long Rest bez spell slota."}, "raceFeatures": {"Variant Human": [["Ability Score Increase", "Dwie różne cechy zwiększają się o 1."], ["Extra Skill", "Proficiency w jednej dodatkowej umiejętności."], ["Bonus Feat", "Dodatkowy feat już na 1. poziomie."]], "Warforged": [["Constructed Resilience", "Advantage na saving throws przeciwko Poisoned, resistance na poison damage, odporność na choroby. Nie musisz jeść, pić ani oddychać."], ["Sentry's Rest", "Podczas Long Rest pozostajesz nieruchomy, ale zachowujesz świadomość otoczenia."], ["Integrated Protection", "+1 AC. Pancerz jest trudniejszy do usunięcia wbrew twojej woli."], ["Specialized Design", "Dodatkowa proficiency w jednej umiejętności i jednym zestawie narzędzi."]], "Air Genasi": [["Darkvision", "Widzisz w ciemności do 60 ft."], ["Unending Breath", "M tworzeniu większemu od ciebie. Liczba użyć zależy od proficiency bonus."], ["Nimble Escape", "Bonus Action: Disengage albo Hide."]], "Firbolg": [["Firbolg Magic", "Masz dostęp do Detect Magic i Disguise Self raz na Short lub Long Rest, z możliwością używania własnych slotów."], ["Hidden Step", "Bonus Action: stajesz się niewidzialny do początku następnej tury lub do wykonania ataku/damage roll/saving throw."], ["Powerful Build", "Liczysz się jako większy przy obliczaniu udźwigu."], ["Speech of Beast and Leaf", "Możesz w ograniczony sposób komunikować się z bestiami i roślinami."]], "Shadar-kai": [["Darkvision", "Widzisz w ciemności do 60 ft."], ["Necrotic Resistance", "Resistance na necrotic damage."], ["Blessing of the Raven Queen", "Bonus Action teleport na 30 ft. Od 3. poziomu po teleportacji zyskujesz resistance na wszystkie obrażenia do początku następnej tury."], ["Keen Senses", "Proficiency w Perception."], ["Trance", "Nie śpisz normalnie. Cztery godziny medytacji zastępują osiem godzin snu."]], "Fire Genasi": [["Darkvision", "Widzisz w ciemności do 60 ft."], ["Fire Resistance", "Resistance na fire damage."], ["Reach to the Blaze", "Znasz Produce Flame. Wraz z poziomem zyskujesz Burning Hands i Flame Blade, z darmowym użyciem zgodnie z zasadami rasy."]], "Changeling": [["Shapechanger", "Jako Action zmieniasz wygląd ciała i głosu w granicach swojej budowy. Ekwipunek się nie zmienia."], ["Changeling Instincts", "Proficiency w dwóch umiejętnościach społecznych z dostępnej listy."]], "Githyanki": [["Astral Knowledge", "Po Long Rest możesz uzyskać tymczasową proficiency w jednej wybranej umiejętności lub narzędziu."], ["Psychic Resilience", "Resistance na psychic damage."], ["Githyanki Psionics", "Zyskujesz Mage Hand, Jump i Misty Step wraz z rozwojem poziomu."]], "Plasmoid": [["Amorphous", "Możesz przeciskać się przez bardzo małe otwory, jeśli nie masz przy sobie zbyt dużego wyposażenia."], ["Darkvision", "Widzisz w ciemności do 60 ft."], ["Hold Breath", "Możesz wstrzymać oddech przez godzinę."], ["Natural Resilience", "Advantage na saving throws przeciwko Poisoned i resistance na acid oraz poison damage."], ["Shape Self", "Możesz zmieniać kształt ciała i tworzyć prostą pseudopodową kończynę do manipulowania przedmiotami."]]}, "classFeatures": {"Fighter": [["Fighting Style", "Wybierasz stałą specjalizację bojową. Konkretna karta pokazuje wybrany styl."], ["Second Wind", "Bonus Action. Odzyskujesz 1d10 + poziom Fightera HP. Jedno użycie, wraca po Short lub Long Rest."], ["Action Surge", "Raz pomiędzy Short lub Long Rest wykonujesz dodatkową Action w swojej turze."], ["Ability Score Improvement", "Na 4. poziomie zwiększasz cechy albo bierzesz feat."], ["Extra Attack", "Od 5. poziomu wykonujesz dwa ataki, gdy używasz Attack Action."]], "Artificer": [["Magical Tinkering", "Nadajesz małym niemagicznym przedmiotom proste efekty, takie jak światło, dźwięk, zapach, tekst lub obraz."], ["Spellcasting", "Rzucasz zaklęcia przez INT. Artificer przygotowuje zaklęcia i używa narzędzi lub odpowiedniego focusa."], ["Infuse Item", "Znasz 4 infusions i możesz utrzymywać 2 aktywne. Pozwalają wzmacniać broń, pancerz i tworzyć magiczne odpowiedniki gadżetów."], ["Right Tool for the Job", "Po godzinie pracy z Tinker's Tools możesz stworzyć potrzebny zestaw Artisan's Tools."], ["Ability Score Improvement", "Na 4. poziomie zwiększasz cechy albo bierzesz feat."]], "Paladin": [["Divine Sense", "Action. Wykrywasz Celestials, Fiends i Undead w 60 ft, jeśli nie są za total cover. Liczba użyć to 1 + CHA modifier na Long Rest."], ["Lay on Hands", "Masz pulę 5 × poziom Paladina HP. Action, dotyk. Możesz leczyć albo wydać 5 punktów, aby usunąć chorobę lub truciznę."], ["Fighting Style", "Na 2. poziomie wybierasz specjalizację bojową. Konkretna karta pokazuje wybrany styl."], ["Spellcasting", "Rzucasz zaklęcia paladyna przez CHA. Przygotowujesz CHA modifier + połowa poziomu Paladina zaklęć."], ["Divine Smite", "Po trafieniu melee weapon attack możesz wydać spell slot, aby dodać 2d8 radiant za slot 1. poziomu, +1d8 za każdy poziom wyżej, oraz dodatkowe 1d8 przeciwko Fiend lub Undead."], ["Divine Health", "Od 3. poziomu jesteś odporny na choroby."], ["Sacred Oath", "Na 3. poziomie dostajesz Oath Spells oraz Channel Divinity zależne od przysięgi."], ["Ability Score Improvement", "Na 4. poziomie zwiększasz cechy albo bierzesz feat."], ["Extra Attack", "Od 5. poziomu wykonujesz dwa ataki, gdy używasz Attack Action."]], "Barbarian": [["Rage", "Bonus Action. Na 5. poziomie 3 użycia na Long Rest. Podczas Rage masz Advantage na STR checks i STR saves, +2 damage do ataków opartych na STR oraz resistance na bludgeoning, piercing i slashing."], ["Unarmored Defense", "Bez pancerza AC = 10 + DEX modifier + CON modifier. Możesz używać tarczy."], ["Reckless Attack", "Przy pierwszym ataku STR w turze możesz zyskać Advantage na wszystkie swoje melee STR attacks w tej turze, ale ataki przeciwko tobie mają Advantage do początku następnej tury."], ["Danger Sense", "Advantage na DEX Saves przeciwko widocznym efektom, jeśli nie jesteś Blinded, Deafened ani Incapacitated."], ["Primal Path", "Na 3. poziomie dostajesz cechy wybranej ścieżki."], ["Ability Score Improvement", "Na 4. poziomie zwiększasz cechy albo bierzesz feat."], ["Extra Attack", "Od 5. poziomu wykonujesz dwa ataki w Attack Action."], ["Fast Movement", "+10 ft Speed, jeśli nie nosisz heavy armor."]], "Monk": [["Unarmored Defense", "Bez pancerza i tarczy AC = 10 + DEX modifier + WIS modifier."], ["Martial Arts", "Możesz używać DEX zamiast STR z unarmed strikes i monk weapons. Na 5. poziomie kość Martial Arts to d6. Po Attack Action możesz wykonać jeden unarmed strike jako Bonus Action."], ["Ki", "Masz 5 Ki Points. Wracają po Short lub Long Rest. Podstawowe opcje to Flurry of Blows, Patient Defense i Step of the Wind."], ["Flurry of Blows", "Po Attack Action wydajesz 1 Ki i wykonujesz dwa unarmed strikes jako Bonus Action."], ["Patient Defense", "Wydajesz 1 Ki, aby użyć Dodge jako Bonus Action."], ["Step of the Wind", "Wydajesz 1 Ki, aby użyć Disengage lub Dash jako Bonus Action, a twoja odległość skoku podwaja się w tej turze."], ["Unarmored Movement", "+10 ft Speed bez pancerza i tarczy."], ["Deflect Missiles", "Reaction po trafieniu ranged weapon attackiem. Redukujesz damage o 1d10 + DEX modifier + poziom Monka. Jeśli zejdziesz do 0, możesz wydać 1 Ki i odrzucić pocisk."], ["Slow Fall", "Reaction podczas spadania. Redukujesz fall damage o 5 × poziom Monka, czyli 25."], ["Ability Score Improvement", "Na 4. poziomie zwiększasz cechy albo bierzesz feat."], ["Extra Attack", "Od 5. poziomu wykonujesz dwa ataki w Attack Action."], ["Stunning Strike", "Po trafieniu melee weapon attack wydajesz 1 Ki. Cel wykonuje CON Save przeciwko Ki Save DC. Przy porażce jest Stunned do końca twojej następnej tury."]], "Rogue": [["Expertise", "Na 1. poziomie wybierasz dwie proficiency, w których podwajasz proficiency bonus."], ["Sneak Attack", "Raz na turę przy spełnieniu warunków dodajesz 3d6 damage do trafienia finesse lub ranged weapon."], ["Thieves' Cant", "Znasz tajny żargon przestępczego półświatka."], ["Cunning Action", "Bonus Action w każdej turze: Dash, Disengage albo Hide."], ["Roguish Archetype", "Na 3. poziomie dostajesz cechy wybranej podklasy."], ["Ability Score Improvement", "Na 4. poziomie zwiększasz cechy albo bierzesz feat."], ["Uncanny Dodge", "Reaction po trafieniu przez widocznego napastnika. Zmniejszasz damage z tego ataku o połowę."]], "Wizard": [["Spellcasting", "Rzucasz zaklęcia przez INT. Prowadzisz spellbook i przygotowujesz INT modifier + poziom Wizarda zaklęć."], ["Arcane Recovery", "Raz dziennie po Short Rest odzyskujesz spell slots o łącznym poziomie do połowy poziomu Wizarda zaokrąglonej w górę."], ["Arcane Tradition", "Na 2. poziomie wybierasz szkołę magii i dostajesz jej cechy."], ["Ability Score Improvement", "Na 4. poziomie zwiększasz cechy albo bierzesz feat."]], "Sorcerer": [["Spellcasting", "Rzucasz zaklęcia przez CHA. Znasz ograniczoną liczbę zaklęć, ale możesz je modyfikować Metamagią."], ["Sorcerous Origin", "Na 1. poziomie wybierasz źródło mocy i dostajesz jego cechy."], ["Font of Magic", "Na 2. poziomie dostajesz Sorcery Points. Na 5. poziomie masz 5. Możesz zamieniać je na spell slots i odwrotnie."], ["Metamagic", "Na 3. poziomie wybierasz 2 opcje zmiany sposobu działania zaklęć."], ["Ability Score Improvement", "Na 4. poziomie zwiększasz cechy albo bierzesz feat."]], "Warlock": [["Pact Magic", "Rzucasz zaklęcia przez CHA. Na 5. poziomie masz 2 spell slots 3. poziomu, które wracają po Short lub Long Rest."], ["Otherworldly Patron", "Na 1. poziomie wybierasz patrona i dostajesz jego cechy."], ["Eldritch Invocations", "Na 5. poziomie znasz 3 invocations, które stale zmieniają twoje możliwości."], ["Pact Boon", "Na 3. poziomie wybierasz specjalny dar patrona, np. Chain, Blade albo Tome."], ["Ability Score Improvement", "Na 4. poziomie zwiększasz cechy albo bierzesz feat."]], "Ranger": [["Favored Enemy", "Masz specjalistyczną wiedzę o wybranym typie przeciwników i przewagi w śledzeniu oraz wiedzy o nich."], ["Natural Explorer", "Jesteś specjalistą w podróżowaniu i przetrwaniu w wybranym typie terenu."], ["Fighting Style", "Na 2. poziomie wybierasz specjalizację bojową."], ["Spellcasting", "Rzucasz zaklęcia Rangera przez WIS. Na 5. poziomie masz sloty 1. i 2. poziomu."], ["Primeval Awareness", "Możesz wydać spell slot, aby wyczuć obecność określonych typów stworzeń w dużym obszarze."], ["Ranger Archetype", "Na 3. poziomie dostajesz cechy podklasy."], ["Ability Score Improvement", "Na 4. poziomie zwiększasz cechy albo bierzesz feat."], ["Extra Attack", "Od 5. poziomu wykonujesz dwa ataki w Attack Action."]], "Druid": [["Druidic", "Znasz tajny język druidów."], ["Spellcasting", "Rzucasz zaklęcia przez WIS i przygotowujesz WIS modifier + poziom Druida zaklęć."], ["Wild Shape", "Dwa użycia na Short lub Long Rest. Action, przemieniasz się w dozwoloną formę bestii zgodnie z limitem CR i ruchem."], ["Druid Circle", "Na 2. poziomie wybierasz krąg i dostajesz jego cechy."], ["Ability Score Improvement", "Na 4. poziomie zwiększasz cechy albo bierzesz feat."], ["Wild Shape Improvement", "Na 4. poziomie rośnie limit dostępnych form i możesz używać form z swim speed zgodnie z tabelą Wild Shape."]]}, "subclassFeatures": {"Battle Master": [["Combat Superiority", "Masz 4 Superiority Dice d8. Wszystkie wracają po Short lub Long Rest. Maneuver Save DC = 8 + proficiency bonus + STR albo DEX modifier."], ["Student of War", "Proficiency w jednym zestawie Artisan's Tools."]], "Armorer": [["Tools of the Trade", "Proficiency z heavy armor i Smith's Tools."], ["Armorer Spells", "Magic Missile i Thunderwave są zawsze przygotowane na 3. poziomie, Mirror Image i Shatter dochodzą na 5. poziomie."], ["Arcane Armor", "Pancerz staje się spellcasting focus, ignoruje wymagania STR, nie można go łatwo zdjąć wbrew tobie i może zastępować brakujące kończyny."], ["Armor Model", "Po odpoczynku wybierasz Guardian albo Infiltrator."], ["Guardian: Thunder Gauntlets", "Melee weapon oparta na INT, 1d8 thunder. Trafiony cel ma Disadvantage na ataki przeciwko innym celom do początku twojej następnej tury."], ["Guardian: Defensive Field", "Bonus Action daje Temporary HP równe poziomowi Artificera. Użycia = proficiency bonus na Long Rest."], ["Infiltrator: Lightning Launcher", "Ranged weapon oparta na INT, 1d6 lightning. Raz na turę jedno trafienie zadaje dodatkowe 1d6."], ["Infiltrator: Powered Steps", "+5 ft walking speed."], ["Infiltrator: Dampening Field", "Advantage na Stealth. Jeśli pancerz dawał Disadvantage, efekty się znoszą."], ["Extra Attack", "Od 5. poziomu Armorer wykonuje dwa ataki w Attack Action."]], "Artillerist": [["Tool Proficiency", "Proficiency w Woodcarver's Tools."], ["Artillerist Spells", "Shield i Thunderwave są zawsze przygotowane, na 5. poziomie dochodzą Scorching Ray i Shatter."], ["Eldritch Cannon", "Action do stworzenia małego lub Tiny działa. Wybierasz Flamethrower, Force Ballista albo Protector. Działo aktywujesz Bonus Action. Możesz stworzyć je darmowo raz na Long Rest albo wydać spell slot."], ["Arcane Firearm", "Możesz zmienić różdżkę, laskę lub pręt w Arcane Firearm. Gdy rzucasz przez niego artificer spell z damage roll, dodajesz dodatkowe 1d8 do jednego rzutu obrażeń."]], "Oath of Glory": [["Oath Spells", "Zawsze przygotowane: Guiding Bolt, Heroism, Enhance Ability i Magic Weapon na tym poziomie."], ["Channel Divinity: Peerless Athlete", "Bonus Action. Przez 10 minut Advantage na Athletics i Acrobatics, większy udźwig oraz dłuższe skoki."], ["Channel Divinity: Inspiring Smite", "Po Divine Smite możesz jako Bonus Action rozdzielić 2d8 + poziom Paladina Temporary HP pomiędzy stworzenia w 30 ft."]], "Oath of Vengeance": [["Oath Spells", "Zawsze przygotowane: Bane, Hunter's Mark, Hold Person i Misty Step na tym poziomie."], ["Channel Divinity: Abjure Enemy", "Action. Wybrany przeciwnik w 60 ft wykonuje WIS Save. Przy porażce staje się Frightened i jego Speed spada do 0 na czas działania."], ["Channel Divinity: Vow of Enmity", "Bonus Action. Wybierasz cel w 10 ft i masz Advantage na attack rolls przeciwko niemu przez 1 minutę lub do zakończenia efektu."]], "Oath of Conquest": [["Oath Spells", "Zawsze przygotowane: Armor of Agathys, Command, Hold Person i Spiritual Weapon na tym poziomie."], ["Channel Divinity: Conquering Presence", "Action. Wybrane stworzenia w 30 ft wykonują WIS Save; przy porażce są Frightened przez 1 minutę, z możliwością ponawiania save."], ["Channel Divinity: Guided Strike", "Po attack roll możesz dodać +10 do wyniku."]], "Path of the Giant": [["Giant Power", "Zyskujesz dodatkowy język oraz cantrip związany z olbrzymią siłą zgodnie z wersją podklasy."], ["Giant's Havoc", "Podczas Rage możesz stać się Large, zwiększa się zasięg twoich melee attacks, a twoja zdolność do rzucania i operowania ciężarem rośnie."]], "Path of the Beast": [["Form of the Beast", "Gdy wchodzisz w Rage, tworzysz naturalną broń: Bite, Claws albo Tail. Każda ma inny styl walki i liczy się jako simple melee weapon dla ciebie."]], "Way of the Open Hand": [["Open Hand Technique", "Po trafieniu jednym z ataków Flurry of Blows możesz wymusić DEX Save, aby przewrócić cel; STR Save, aby odepchnąć go o 15 ft; albo wyłączyć jego Reactions do końca twojej następnej tury."]], "Way of the Kensei": [["Kensei Weapons", "Wybierasz broń melee i ranged jako kensei weapons. Liczą się jako monk weapons."], ["Agile Parry", "Jeśli wykonasz unarmed strike w Attack Action, trzymając melee kensei weapon, dostajesz +2 AC do początku swojej następnej tury."], ["Kensei's Shot", "Bonus Action. Ranged attacks kensei weapon zadają +1d4 damage do końca tury."], ["Way of the Brush", "Proficiency w wybranym zestawie narzędzi artystycznych."]], "Assassin": [["Bonus Proficiencies", "Proficiency z disguise kit i poisoner's kit."], ["Assassinate", "Masz Advantage na attack rolls przeciwko stworzeniom, które jeszcze nie wykonały tury w walce. Trafienie z zaskoczenia jest critical hit."]], "School of Abjuration": [["Abjuration Savant", "Przepisywanie zaklęć Abjuration do spellbooka kosztuje mniej czasu i złota."], ["Arcane Ward", "Pierwsze zaklęcie Abjuration 1. poziomu lub wyższego tworzy ward z HP równym 2 × poziom Wizarda + INT modifier. Ward przyjmuje obrażenia przed tobą i może być odnawiany kolejnymi zaklęciami Abjuration."]], "School of Illusion": [["Illusion Savant", "Przepisywanie zaklęć Illusion do spellbooka kosztuje mniej czasu i złota."], ["Improved Minor Illusion", "Znasz Minor Illusion. Możesz jednocześnie stworzyć w nim obraz i dźwięk."]], "Aberrant Mind": [["Psionic Spells", "Dostajesz dodatkowe zaklęcia psioniczne, które nie liczą się do normalnego limitu known spells."], ["Telepathic Speech", "Bonus Action. Tworzysz telepatyczne połączenie z jedną widoczną istotą w zasięgu zależnym od CHA. Działa przez liczbę minut równą poziomowi Sorcerera."]], "Divine Soul": [["Divine Magic", "Możesz wybierać zaklęcia zarówno z listy Sorcerera, jak i Clerica. Dostajesz też dodatkowe zaklęcie zależne od powinowactwa."], ["Favored by the Gods", "Raz na Short lub Long Rest po nieudanym saving throw lub attack roll dodajesz 2d4, potencjalnie zmieniając wynik."]], "Archfey": [["Expanded Spell List", "Patron rozszerza listę dostępnych zaklęć między innymi o Faerie Fire, Sleep, Calm Emotions, Phantasmal Force i inne iluzje/kontrolę."], ["Fey Presence", "Action. Stworzenia w 10-ft cube wykonują WIS Save; przy porażce są Charmed albo Frightened do końca twojej następnej tury."]], "Monster Slayer": [["Monster Slayer Magic", "Dostajesz dodatkowe zaklęcia podklasy; na tym poziomie przede wszystkim Protection from Evil and Good oraz Zone of Truth."], ["Hunter's Sense", "Action. Poznajesz odporności, immunities i vulnerabilities celu w 60 ft, jeśli nie jest chroniony przed divination."], ["Slayer's Prey", "Bonus Action. Oznaczasz widoczny cel w 60 ft. Pierwsze trafienie w każdej twojej turze zadaje dodatkowe 1d6 weapon damage."]], "Circle of the Land (Forest)": [["Bonus Cantrip", "Znasz jeden dodatkowy druid cantrip."], ["Natural Recovery", "Raz dziennie po Short Rest odzyskujesz spell slots o łącznym poziomie do połowy poziomu Druida zaokrąglonej w górę."], ["Circle Spells", "Zawsze przygotowane zaklęcia Forest: Barkskin i Spider Climb od 3. poziomu, Call Lightning i Plant Growth od 5. poziomu."]]}, "maneuverDesc": {"Trip Attack": "Po trafieniu wydajesz Superiority Die, dodajesz ją do damage. Cel Large lub mniejszy wykonuje STR Save; przy porażce pada Prone.", "Precision Attack": "Dodajesz Superiority Die do attack roll. Możesz zdecydować po rzucie, zanim poznasz ostateczny wynik.", "Bait and Switch": "Wydajesz 5 ft ruchu i zamieniasz się miejscami z sojusznikiem w 5 ft bez Opportunity Attacks. Jedno z was dostaje bonus do AC równy Superiority Die do początku twojej następnej tury.", "Pushing Attack": "Po trafieniu dodajesz Superiority Die do damage. Przy nieudanym STR Save możesz odepchnąć cel do 15 ft.", "Riposte": "Gdy stworzenie spudłuje melee attack przeciwko tobie, Reaction i Superiority Die pozwalają wykonać melee attack; przy trafieniu dodajesz kość do damage.", "Menacing Attack": "Po trafieniu dodajesz Superiority Die do damage. Cel wykonuje WIS Save; przy porażce jest Frightened do końca twojej następnej tury.", "Disarming Attack": "Po trafieniu dodajesz Superiority Die do damage. Cel robi STR Save; przy porażce upuszcza trzymany przedmiot.", "Grappling Strike": "Po trafieniu melee attack możesz wydać Superiority Die i jako Bonus Action spróbować Grapple, dodając wynik kości do Athletics check."}, "backgroundDesc": {"Soldier": "Military Rank. Twoje szkolenie i stopień dają rozpoznawalność oraz dostęp do pomocy wojskowej, jeśli fabuła na to pozwala.", "Guild Artisan": "Guild Membership. Masz kontakty zawodowe i rozpoznawalność w swoim fachu.", "Noble": "Position of Privilege. Osoby świadome twojej pozycji społecznej zwykle traktują cię z odpowiednim szacunkiem.", "Sage": "Researcher. Jeśli nie znasz informacji, zwykle potrafisz ustalić, gdzie można jej szukać.", "Criminal": "Criminal Contact. Masz wiarygodny kontakt ze środowiskiem przestępczym.", "Haunted One": "Heart of Darkness. Zwykli ludzie często okazują ci pomoc, gdy widzą, że mierzysz się z czymś przerażającym.", "Charlatan": "False Identity. Masz przygotowaną alternatywną tożsamość i narzędzia do jej podtrzymywania.", "Hermit": "Discovery. W okresie odosobnienia odkryłeś istotną wiedzę lub sekret.", "Far Traveler": "All Eyes on You. Twoje pochodzenie i zachowanie przyciągają uwagę miejscowych.", "Outlander": "Wanderer. Dobrze pamiętasz mapy i teren oraz łatwiej znajdujesz pożywienie i wodę w dziczy.", "Entertainer": "By Popular Demand. Zwykle możesz znaleźć miejsce do występu i uzyskać podstawowe zakwaterowanie za występ.", "Investigator": "Watcher's Eye. Masz doświadczenie w obserwacji, dochodzeniu i kontaktach z lokalnymi służbami.", "Mercenary Veteran": "Mercenary Life. Znasz struktury ": 8}, "fixedPerLevel": {"12": 7, "10": 6, "8": 5, "6": 4}, "skillPL": {"Acrobatics": "Akrobatyka", "Animal Handling": "Opieka nad zwierzętami", "Arcana": "Arkana", "Athletics": "Atletyka", "Deception": "Oszustwo", "History": "Historia", "Insight": "Wnikliwość", "Intimidation": "Zastraszanie", "Investigation": "Śledztwo", "Medicine": "Medycyna", "Nature": "Przyroda", "Perception": "Percepcja", "Performance": "Występy", "Persuasion": "Perswazja", "Religion": "Religia", "Sleight of Hand": "Zręczne dłonie", "Stealth": "Skradanie się", "Survival": "Przetrwanie"}, "skillTooltips": {"Acrobatics": "Utrzymanie równowagi w trudnej sytuacji, wykonanie akrobatycznej sztuczki.", "Animal Handling": "Uspokojenie, tresura zwierzęcia lub skłonienie go do posłuszeństwa.", "Arcana": "Wiedza o magii, przedmiotach magicznych, planach egzystencji.", "Athletics": "Skok w dal, pływanie w trudnych warunkach, forsowanie przeszkód.", "Deception": "Wiarygodne kłamstwo, przebranie, udawanie kogoś innego.", "History": "Wiedza o wydarzeniach, postaciach i kulturach historycznych.", "Insight": "Odczytywanie emocji, nastroju lub intencji rozmówcy.", "Intimidation": "Groźby, wymuszanie posłuszeństwa, wzbudzanie strachu.", "Investigation": "Analiza śladów, znajdowanie wskazówek, badanie działania czegoś.", "Medicine": "Diagnozowanie chorób, sprawdzanie przyczyn śmierci.", "Nature": "Wiedza o zwierzętach, roślinach, zjawiskach naturalnych.", "Perception": "Zauważenie ukrytych rzeczy, nasłuchiwanie, wypatrywanie.", "Performance": "Muzyka, taniec, aktorstwo, opowiadanie historii.", "Persuasion": "Uczciwe przekonywanie, dyplomacja, negocjacje.", "Religion": "Wiedza o bogach, rytuałach, symbolach religijnych.", "Sleight of Hand": "Kradzież kieszonkowa, ukrywanie przedmiotów, sztuczki.", "Stealth": "Ciche poruszanie się, ukrywanie się przed wzrokiem.", "Survival": "Tropienie, orientacja w terenie, znajdowanie pożywienia."}, "abilityPL": {"STR": "Siła", "DEX": "Zręczność", "CON": "Kondycja", "INT": "Inteligencja", "WIS": "Mądrość", "CHA": "Charyzma"}, "skillAliasDefault": {"Acrobatics": "Parkour", "Animal Handling": "Praca ze zwierzętami", "Arcana": "Anomalie", "Athletics": "Sprawność", "Deception": "Przykrywka", "History": "Wiedza o świecie", "Insight": "Profilowanie", "Intimidation": "Presja", "Investigation": "Analiza", "Medicine": "Pierwsza pomoc", "Nature": "Nauki przyrodnicze", "Perception": "Czujność", "Performance": "Prezentacja", "Persuasion": "Negocjacje", "Religion": "Kosmologia / okultyzm", "Sleight of Hand": "Sabotaż manualny", "Stealth": "Infiltracja", "Survival": "Operacje terenowe"}};
const PB = 3;
const ABILITIES = ["STR","DEX","CON","INT","WIS","CHA"];
let activeFilter = "Wszyscy";

function mod(score) { return Math.floor((score-10)/2); }
function fmt(n) { return n >= 0 ? "+"+n : String(n); }
function hp(c) {
  const hd = DB.hitdie[c.cls], con = mod(c.stats.CON), avg = DB.fixedPerLevel[hd];
  let value = hd + con + 4*(avg+con);
  if (c.feats.includes("Tough")) value += 10;
  return value;
}
function initiative(c) {
  let n = mod(c.stats.DEX);
  if (c.feats.includes("Alert")) n += 5;
  if ((c.raceRules || c.race) === "Harengon") n += PB;
  return n;
}
function skillBonus(c, skill) {
  const a = DB.skillAbility[skill];
  let n = mod(c.stats[a]);
  if (c.expertise.includes(skill)) n += PB*2;
  else if (c.skillProfs.includes(skill)) n += PB;
  return n;
}
function passive(c, skill) { return 10 + skillBonus(c, skill); }
function saveBonus(c,a) { return mod(c.stats[a]) + (c.saveProfs.includes(a)?PB:0); }
function spellInfo(c) {
  const a = DB.spellAbility[c.cls];
  if (!a) return null;
  const m = mod(c.stats[a]);
  return {ability:a, dc:8+PB+m, attack:PB+m, slots:DB.spellSlots[c.cls]};
}
function profs(c) {
  let [armor,weapons] = DB.classProfs[c.cls] || ["—","—"];
  if (c.subclass==="Armorer") armor = armor + ", Heavy";
  return [
    ["Pochodzenie Marvela",c.race],["Mechanika rasy D&D",c.raceRules || c.race],
    ...(c.team?[["Drużyna / środowisko",c.team]]:[]),
    ["Armor",armor],["Weapons",weapons],
    ["Tools",c.tools || DB.bgTools[c.background] || "—"],
    ["Languages",c.languages || "English"],
    ["Background feature",DB.backgroundDesc[c.background] || "—"]
  ];
}
function card(title, body, full=false) {
 return `<section class="card ${full?"full":""}"><div class="card-head"><h3>${title}</h3></div><div class="card-body">${body}</div></section>`;
}
function rows(items) {
 return `<div class="rows">${items.map(([k,v])=>`<div class="row"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}</div>`;
}
function features(items, tag="") {
 if (!items || !items.length) return `<div class="note">Brak dodatkowych cech w tej sekcji.</div>`;
 return items.map(x=>`<div class="feature"><h4>${x[0]}${tag?`<span class="tag">${tag}</span>`:""}</h4><p>${x[1]}</p></div>`).join("");
}
function attacks(items) {
 if (!items?.length) return `<div class="note">Brak osobnej broni wpisanej na kartę.</div>`;
 return items.map(a=>`<div class="attack"><strong>${a[0]}</strong><div>${a[1]}</div><div>${a[2]}</div><small>${a[3]}</small></div>`).join("");
}
function spells(items) {
 if (!items?.length) return `<div class="note">Ta postać nie ma przygotowanych ani znanych zaklęć na tej karcie.</div>`;
 return items.map(s=>`<div class="spell"><strong>${s[0]}</strong><div>${s[1]}</div></div>`).join("");
}
function allFeatures(c) {
 let arr = [];
 const rulesRace = c.raceRules || c.race;
 arr.push(...(DB.raceFeatures[rulesRace]||[]).map(x=>{
   const ov = c.raceFeatureOverrides && c.raceFeatureOverrides[x[0]];
   const title = ov ? ov[0] : x[0];
   const desc = ov ? ov[1] : x[1];
   return [`${c.race}: ${title}`,`${desc} <span class="subtle">Mechanika bazowa: ${rulesRace}.</span>`];
 }));
 arr.push(...(DB.classFeatures[c.cls]||[]).map(x=>[`${c.cls}: ${x[0]}`,x[1]]));
 arr.push(...(DB.subclassFeatures[c.subclass]||[]).map(x=>[`${c.subclass}: ${x[0]}`,x[1]]));
 if (c.fighting) arr.push(["Wybrany Fighting Style",c.fighting]);
 if (c.maneuvers?.length) {
   const dc = 8+PB+Math.max(mod(c.stats.STR),mod(c.stats.DEX));
   arr.push(["Maneuver Save DC",String(dc)]);
   c.maneuvers.forEach(m=>arr.push([`Maneuver: ${m}`,DB.maneuverDesc[m]]));
 }
 if (c.extras?.length) arr.push(...c.extras);
 return arr;
}
function featItems(c) {
 return c.feats.map(f=>[f,DB.featDesc[f] || "Opis featu nie został jeszcze dodany."]);
}
function skillDisplayName(c, skill) {
 const pl = DB.skillPL[skill] || skill;
 const alias = (c.skillAliases && c.skillAliases[skill]) || DB.skillAliasDefault[skill];
 return alias ? `${pl} / ${alias}` : pl;
}
function skillTooltip(c, skill) {
 const attr = DB.skillAbility[skill];
 const alias = (c.skillAliases && c.skillAliases[skill]) || DB.skillAliasDefault[skill];
 const base = DB.skillTooltips[skill] || "";
 const aliasLine = alias ? ` Współczesny reskin na tej karcie: „${alias}”.` : "";
 return `${DB.skillPL[skill] || skill} (${DB.abilityPL[attr] || attr}). ${base}${aliasLine} Reskin nie zmienia atrybutu ani zasad testu.`;
}
function escapeAttr(s) {
 return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function skillsTable(c) {
 const names = Object.keys(DB.skillAbility);
 const header = `<div class="skill-header"><div>Umiejętność</div><div>Atrybut</div><div>Premia</div><div>Biegłość</div></div>`;
 const body = names.map(s=>{
   const exp=c.expertise.includes(s), prof=c.skillProfs.includes(s), a=DB.skillAbility[s];
   return `<div class="skill-row">
     <strong><span class="skill-label" tabindex="0" data-tip="${escapeAttr(skillTooltip(c,s))}">${skillDisplayName(c,s)} <span class="info">i</span></span></strong>
     <div class="ability">${DB.abilityPL[a] || a}</div>
     <div class="bonus">${fmt(skillBonus(c,s))}</div>
     <div class="status">${exp?'<span class="tag exp">Ekspertyza</span>':prof?'<span class="tag prof">Biegłość</span>':'—'}</div>
   </div>`;
 }).join("");
 return `<div class="skill-help">Najedź kursorem albo wybierz nazwę umiejętności, aby zobaczyć przykładowe zastosowania ze ściągi. Nazwa po „/” to współczesny lub superbohaterski reskin tej samej umiejętności. Mechanika pozostaje bez zmian.</div><div class="skill-grid">${header}${body}</div>`;
}

function render(id) {
 const c=DB.characters.find(x=>x.id===id)||DB.characters[0];
 document.querySelectorAll(".char-btn").forEach(b=>b.classList.toggle("active",b.dataset.id===c.id));
 const si=spellInfo(c);
 document.getElementById("hero").innerHTML=`
   <div class="eyebrow">${c.group} • poziom 5 • 6,500 XP</div>
   <h2>${c.name}</h2><div class="real">${c.realName}</div>
   <div class="chips"><span class="chip">Pochodzenie: ${c.race}</span><span class="chip">${c.cls} 5</span><span class="chip">${c.subclass}</span>${c.team?`<span class="chip">${c.team}</span>`:""}<span class="chip">${c.background}</span><span class="chip">${c.alignment}</span></div>
   <div class="stats">${ABILITIES.map(a=>`<div class="stat"><div class="lab">${a}</div><div class="score">${c.stats[a]}</div><div class="mod">${fmt(mod(c.stats[a]))}</div></div>`).join("")}</div>
   <div class="quick">
    <div class="q"><span>AC</span><strong>${c.ac}</strong></div>
    <div class="q"><span>HP</span><strong>${hp(c)}</strong></div>
    <div class="q"><span>Hit Dice</span><strong>5d${DB.hitdie[c.cls]}</strong></div>
    <div class="q"><span>Speed</span><strong>${c.speed} ft</strong></div>
    <div class="q"><span>Initiative</span><strong>${fmt(initiative(c))}</strong></div>
    <div class="q"><span>Proficiency</span><strong>+3</strong></div>
   </div>`;
 const saveRows=ABILITIES.map(a=>[a,`${fmt(saveBonus(c,a))} ${c.saveProfs.includes(a)?'<span class="tag prof">Proficient</span>':''}`]);
 const passiveRows=[["Passive Perception",passive(c,"Perception")],["Passive Investigation",passive(c,"Investigation")],["Passive Insight",passive(c,"Insight")]];
 const spellRows=si?[["Spellcasting Ability",si.ability],["Spell Save DC",si.dc],["Spell Attack",fmt(si.attack)],["Spell Slots",si.slots]]:[["Spellcasting","Brak"]];
 document.getElementById("content").innerHTML=
   card("Saving Throws",rows(saveRows))+
   card("Wartości pasywne",rows(passiveRows))+
   card("Umiejętności",skillsTable(c),true)+
   card("Biegłości, pochodzenie, background i języki",rows(profs(c)),true)+
   card("Cechy pochodzenia, klasowe i podklasowe",features(allFeatures(c)),true)+
   card("Featy",features(featItems(c)))+
   card("Marvelowe cechy i przedmioty",features(c.marvel,"homebrew"))+
   card("Ataki",attacks(c.attacks),true)+
   card("Magia",rows(spellRows)+`<div style="height:12px"></div>`+spells(c.spells),true);
 location.hash=c.id;
}
function filters() {
 const groups=["Wszyscy","Mutanci","Małe ziemniaczki","Duże ziemniaczki"];
 const descriptions={
   "Wszyscy":"Wszystkie dostępne postacie.",
   "Mutanci":"Postacie związane z mutacją i środowiskiem X-Men / X-Force.",
   "Małe ziemniaczki":"Bohaterowie uliczni i postacie działające głównie w mniejszej skali.",
   "Duże ziemniaczki":"Bohaterowie większego kalibru: Avengers, magia, kosmos i cięższa artyleria."
 };
 const el=document.getElementById("filters");
 el.innerHTML=groups.map(g=>`<button class="filter ${g===activeFilter?"active":""}" data-filter="${g}" title="${descriptions[g]}">${g}</button>`).join("");
 document.getElementById("categoryHint").textContent=descriptions[activeFilter]||"";
 el.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{
   activeFilter=b.dataset.filter;
   filters();
   buildList(document.getElementById("search").value);
 });
}
function buildList(q="") {
 q=q.trim().toLowerCase();
 const visible=DB.characters.filter(c=>
   (activeFilter==="Wszyscy" || c.group===activeFilter) &&
   (`${c.name} ${c.realName} ${c.race} ${c.raceRules || ""} ${c.cls} ${c.subclass} ${c.team || ""} ${c.group}`.toLowerCase().includes(q))
 );
 const el=document.getElementById("charList");
 el.innerHTML=visible.map(c=>`<button class="char-btn" data-id="${c.id}">
   <span class="char-name">${c.name}</span>
   <span class="char-meta">${c.realName}<br>${c.race} • ${c.cls} • ${c.subclass}${c.team?`<br>${c.team}`:""}</span>
 </button>`).join("");
 el.querySelectorAll(".char-btn").forEach(b=>b.onclick=()=>render(b.dataset.id));
}
document.getElementById("search").addEventListener("input",e=>buildList(e.target.value));
filters(); buildList(); render(location.hash.replace("#","")||"cap");
</script>
